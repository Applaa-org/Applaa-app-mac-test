# Applaa Pro Site Starter Policy
# This file defines professional website standards that are automatically applied to all web apps

site_policy:
  # Site archetype determines IA, navigation, and content patterns
  archetype: "marketing"  # marketing | saas | docs | blog | store | portfolio
  
  # Internationalization settings
  locales: ["en"]
  
  # Accessibility compliance (WCAG 2.2 AA)
  accessibility:
    wcag_2_2_aa: true
    min_contrast: 4.5
    focus_visible: true
    skip_links: true
    aria_labels: true
    alt_text_required: true
    reduced_motion_support: true
    keyboard_navigation: true
  
  # Performance budgets (Core Web Vitals)
  performance_budgets:
    lcp_ms: 2500      # Largest Contentful Paint
    cls: 0.1          # Cumulative Layout Shift
    inp_ms: 200       # Interaction to Next Paint
    ttfb_ms: 800      # Time to First Byte (mobile 4G)
    fcp_ms: 1800      # First Contentful Paint
    lighthouse_min_scores:
      performance: 90
      accessibility: 95
      best_practices: 95
      seo: 95
  
  # SEO & Discoverability
  seo:
    canonical: true
    json_ld: ["Website", "Breadcrumb", "FAQ"]
    og_cards: true
    twitter_cards: true
    sitemap: true
    robots: true
    meta_descriptions: true
    structured_data: true
    clean_urls: true
    hreflang: true
  
  # Progressive Web App features
  pwa:
    enabled: true
    manifest: true
    service_worker: true
    offline_shell_routes: ["/", "/about", "/contact"]
    install_prompt: "engagement_based"  # immediate | engagement_based | disabled
    cache_strategy: "stale_while_revalidate"
  
  # Security headers and policies
  security_headers:
    csp: "default-src 'self'; script-src 'self' 'nonce-{auto}'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';"
    hsts: true
    x_content_type_options: "nosniff"
    x_frame_options: "DENY"
    referrer_policy: "strict-origin-when-cross-origin"
    permissions_policy: ["camera=()", "microphone=()", "geolocation=(self)", "payment=()"]
  
  # Analytics and tracking (privacy-first by default)
  analytics:
    provider: "privacy_first"  # privacy_first | google_analytics | plausible | none
    consent_required: true
    dnt_respect: true
    data_minimization: true
    cookie_consent: "geo_aware"  # always | geo_aware | never
  
  # Error tracking and observability
  observability:
    error_tracking: true
    performance_monitoring: true
    rum_vitals: true
    uptime_monitoring: false  # Enable for production deployments
    lighthouse_ci: true
  
  # Legal and compliance pages (auto-generated)
  legal_pages:
    - "privacy"
    - "terms"
    - "cookies"
    - "accessibility"
    - "contact"
  
  # Default UX behaviors
  defaults:
    dark_mode: "system"  # system | light | dark
    reduced_motion: true
    responsive_images: true
    lazy_loading: true
    form_validation: "real_time"
    form_spam_protection: ["honeypot", "rate_limit", "server_validation"]
    loading_states: "skeleton"  # skeleton | spinner | progress
    empty_states: true
    error_boundaries: true
    toast_notifications: true
  
  # Content and design standards
  content:
    no_lorem_ipsum: true
    industry_specific: true
    readability_grade: 8  # Target reading level (Grade 8-10)
    professional_tone: true
    call_to_actions: true
    varied_content_length: true
  
  # Design system requirements
  design_system:
    tokenized: true
    color_psychology: true  # Industry-appropriate colors
    glassmorphism: true
    gradient_backgrounds: true
    micro_interactions: true
    premium_shadows: true
    responsive_typography: true
    component_library: true
  
  # Navigation and IA (auto-generated based on archetype)
  navigation:
    auto_generate: true
    breadcrumbs: true
    global_search: true
    mobile_optimized: true
    consistent_header_footer: true
  
  # Feature flags for optional enhancements
  features:
    newsletter_signup: true
    social_sharing: true
    testimonials: true
    pricing_tables: false  # Enable for SaaS archetype
    blog_integration: false  # Enable for blog/docs archetype
    search_functionality: true
    contact_forms: true
    feedback_widget: true





