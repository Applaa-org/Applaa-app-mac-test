<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applaa Kids Hub</title>
    <link rel="stylesheet" href="kids-hub.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🎨 Applaa Kids Hub</h1>
            <p class="subtitle">Discover amazing ideas for your apps, games, and Minecraft worlds!</p>
        </header>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search for ideas...">
            <span class="search-icon">🔍</span>
        </div>

        <div class="categories">
            <button class="category-btn active" data-category="all">All</button>
            <button class="category-btn" data-category="apps">App Ideas</button>
            <button class="category-btn" data-category="games">Game Ideas</button>
            <button class="category-btn" data-category="minecraft">Minecraft</button>
            <button class="category-btn" data-category="learning">Learning</button>
        </div>

        <div id="skillsContainer"></div>
    </div>

    <script src="kids-hub.js"></script>
</body>

</html>
