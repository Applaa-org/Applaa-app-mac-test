<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Phone body -->
  <rect x="32" y="16" width="64" height="96" rx="8" ry="8" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="38" y="26" width="52" height="76" rx="4" ry="4" fill="#f8fafc"/>
  
  <!-- Top speaker/camera -->
  <ellipse cx="64" cy="22" rx="8" ry="2" fill="#374151"/>
  
  <!-- Home button -->
  <circle cx="64" cy="108" r="3" fill="#374151"/>
  
  <!-- Screen content - representing app interface -->
  <rect x="42" y="30" width="44" height="8" rx="2" fill="#e2e8f0"/>
  <rect x="42" y="42" width="32" height="6" rx="1" fill="#cbd5e1"/>
  <rect x="42" y="52" width="38" height="6" rx="1" fill="#cbd5e1"/>
  
  <!-- App icons -->
  <rect x="42" y="64" width="12" height="12" rx="2" fill="#10b981"/>
  <rect x="58" y="64" width="12" height="12" rx="2" fill="#f59e0b"/>
  <rect x="74" y="64" width="12" height="12" rx="2" fill="#ef4444"/>
  
  <rect x="42" y="80" width="12" height="12" rx="2" fill="#8b5cf6"/>
  <rect x="58" y="80" width="12" height="12" rx="2" fill="#06b6d4"/>
  <rect x="74" y="80" width="12" height="12" rx="2" fill="#84cc16"/>
  
  <!-- React logo overlay -->
  <g transform="translate(100, 20) scale(0.8)">
    <circle cx="0" cy="0" r="3" fill="#61dafb"/>
    <ellipse cx="0" cy="0" rx="12" ry="4" fill="none" stroke="#61dafb" stroke-width="1.5" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="12" ry="4" fill="none" stroke="#61dafb" stroke-width="1.5" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="12" ry="4" fill="none" stroke="#61dafb" stroke-width="1.5" transform="rotate(120)"/>
  </g>
</svg>






